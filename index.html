<!DOCTYPE html>

<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f5f7fa; 
            color: #333;
        }
        
        /* Header */
        .header {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a {
            color: #333;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #667eea; }
        
        /* Search Bar */
        .search-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .search-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .search-box {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .search-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .search-input-wrapper {
            display: flex;
            gap: 1rem;
        }
        .search-input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .search-btn {
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .search-btn:hover { transform: translateY(-2px); }
        
        /* Main Layout */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 3rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }
        
        /* Filter Sidebar */
        .filter-sidebar {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        .filter-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #333;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .filter-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f0f0f0;
        }
        .filter-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .filter-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 1rem;
            display: block;
        }
        .filter-option {
            display: flex;
            align-items: center;
            margin-bottom: 0.8rem;
            cursor: pointer;
        }
        .filter-option input[type="checkbox"] {
            margin-right: 0.8rem;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .filter-option label {
            cursor: pointer;
            color: #666;
            flex: 1;
        }
        .price-range {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }
        .price-input {
            flex: 1;
            padding: 0.6rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .apply-filters {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.3s;
        }
        .apply-filters:hover { transform: translateY(-2px); }
        
        /* Results Section */
        .results-section {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .results-count {
            font-size: 1.1rem;
            color: #666;
        }
        .results-count strong {
            color: #333;
            font-weight: 700;
        }
        .sort-dropdown {
            padding: 0.7rem 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            background: white;
        }
        
        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 1rem;
        }
        .category-tab {
            padding: 0.7rem 1.5rem;
            background: #f5f5f5;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .category-tab:hover:not(.active) {
            background: #e0e0e0;
        }
        
        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        
        /* Klook Style Cards */
        .result-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #667eea;
        }
        
        .card-image-wrapper {
            position: relative;
            height: 200px;
            overflow: hidden;
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .result-card:hover .card-image {
            transform: scale(1.05);
        }
        .card-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #51cf66;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .card-badge.klook-choice {
            background: #ff6b35;
        }
        .card-wishlist {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 35px;
            height: 35px;
            background: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }
        .card-wishlist:hover {
            background: #ff6b6b;
            color: white;
        }
        
        .card-content {
            padding: 1.2rem;
        }
        .card-category {
            color: #667eea;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .card-title {
            font-size: 1.1rem;
            color: #333;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-booking-info {
            color: #999;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .card-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 0.8rem;
        }
        .card-rating i {
            color: #ffa500;
        }
        .card-rating span {
            color: #666;
            font-size: 0.9rem;
        }
        .card-price {
            font-size: 1.4rem;
            color: #667eea;
            font-weight: 700;
            margin: 1rem 0;
        }
        .card-actions {
            display: flex;
            gap: 0.5rem;
        }
        .card-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .card-btn-details {
            background: #f5f5f5;
            color: #333;
        }
        .card-btn-details:hover {
            background: #e0e0e0;
        }
        .card-btn-book {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .card-btn-book:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem;
            color: #667eea;
            font-size: 1.2rem;
        }
        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* No Results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }
        .no-results i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 1rem;
        }
        
        /* Mobile Responsive */
        @media (max-width: 968px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .filter-sidebar {
                display: none;
            }
            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
        
        @media (max-width: 640px) {
            .search-input-wrapper {
                flex-direction: column;
            }
            .results-grid {
                grid-template-columns: 1fr;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='index.html'">
                <i class="fas fa-plane-departure"></i>
                Travel Express
            </div>
            <nav class="nav-links">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="tours-search.html" style="color: #667eea;"><i class="fas fa-map-marked-alt"></i> Tours</a>
                <a href="admin.html"><i class="fas fa-cog"></i> Admin</a>
            </nav>
        </div>
    </header>

    <!-- Search Bar -->

                    Find Your Perfect Experience
                </h1>

                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput" 
                        placeholder="Search for tours, hotels, activities, destinations..."
                        onkeypress="if(event.key === 'Enter') searchItems()"
                    >
                    <button class="search-btn" onclick="searchItems()">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="main-container">
        
        <!-- Filter Sidebar -->
        <aside class="filter-sidebar">
            <h2 class="filter-title">
                <i class="fas fa-filter"></i> Filters
            </h2>
            
            <!-- Location Filter -->
            <div class="filter-section">
                <label class="filter-label">Location</label>
                <div class="filter-option">
                    <input type="checkbox" id="loc-all" checked onchange="applyFilters()">
                    <label for="loc-all">All Locations</label>
                </div>
                <div class="filter-option">
                    <input type="checkbox" id="loc-colombo" onchange="applyFilters()">
                    <label for="loc-colombo">Colombo</label>
                </div>
                <div class="filter-option">
                    <input type="checkbox" id="loc-kandy" onchange="applyFilters()">
                    <label for="loc-kandy">Kandy</label>
                </div>
                <div class="filter-option">
                    <input type="checkbox" id="loc-ella" onchange="applyFilters()">
                    <label for="loc-ella">Ella</label>
                </div>
                <div class="filter-option">
                    <input type="checkbox" id="loc-galle" onchange="applyFilters()">
                    <label for="loc-galle">Galle</label>
                </div>
                <button style="background: none; border: none; color: #667eea; cursor: pointer; margin-top: 0.5rem; font-size: 0.9rem;">
                    <i class="fas fa-map-marker-alt"></i> See all
                </button>
            </div>
            
            <!-- Dates Filter -->
            <div class="filter-section">
                <label class="filter-label">Dates</label>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="card-btn card-btn-details" style="padding: 0.5rem 1rem; font-size: 0.9rem;">
                        Today
                    </button>
                    <button class="card-btn card-btn-details" style="padding: 0.5rem 1rem; font-size: 0.9rem;">
                        Tomorrow
                    </button>
                    <button class="card-btn card-btn-details" style="padding: 0.5rem 1rem; font-size: 0.9rem;">
                        <i class="fas fa-calendar"></i> All dates
                    </button>
                </div>
            </div>
            
            <!-- Price Range Filter -->
            <div class="filter-section">
                <label class="filter-label">Price range</label>
                <div style="margin: 1rem 0;">
                    <input type="range" min="0" max="1000" value="867" style="width: 100%; accent-color: #ff6b35;">
                </div>
                <div class="price-range">
                    <input type="number" class="price-input" placeholder="US$ 0" value="0">
                    <span>-</span>
                    <input type="number" class="price-input" placeholder="US$ 867" value="867">
                </div>
            </div>
            
            <!-- Others Filter -->
            <div class="filter-section">
                <label class="filter-label">Others</label>
                <div class="filter-option">
                    <input type="checkbox" id="instant" onchange="applyFilters()">
                    <label for="instant">Instant confirmation</label>
                </div>
            </div>
            
            <button class="apply-filters" onclick="applyFilters()">
                <i class="fas fa-check"></i> Apply Filters
            </button>
        </aside>

        <!-- Results Section -->
        <section class="results-section">
            
            <!-- Category Tabs -->
            <div class="category-tabs">
                <button class="category-tab active" onclick="filterByCategory('all')">
                    <i class="fas fa-th"></i> All
                </button>
                <button class="category-tab" onclick="filterByCategory('hotels')">
                    <i class="fas fa-hotel"></i> Hotels
                </button>
                <button class="category-tab" onclick="filterByCategory('tours')">
                    <i class="fas fa-map-marked-alt"></i> Tours & Experiences
                </button>
                <button class="category-tab" onclick="filterByCategory('transport')">
                    <i class="fas fa-bus"></i> Transport
                </button>
            </div>
            
            <!-- Results Header -->
            <div class="results-header">
                <div class="results-count">
                    <strong id="resultsCount">0</strong> results found
                </div>
                <select class="sort-dropdown" id="sortDropdown" onchange="sortItems()">
                    <option value="recommended">Recommended</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="rating">Highest Rated</option>
                    <option value="popular">Most Popular</option>
                </select>
            </div>
            
            <!-- Results Grid -->
            <div class="results-grid" id="resultsGrid">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading results...</p>
                </div>
            </div>
            
            <!-- No Results -->
            <div class="no-results" id="noResults" style="display: none;">
                <i class="fas fa-search"></i>
                <h2>No results found</h2>
                <p>Try adjusting your filters or search criteria</p>
            </div>
            
        </section>
    </div>

        // Load Items
        function loadItems() {
            Promise.all([
                db.collection('hotels').get(),
                db.collection('tours').get()
            ]).then(([hotelsSnapshot, toursSnapshot]) => {
                allItems = [];
                
                // Add hotels
                hotelsSnapshot.forEach(doc => {
                    const data = doc.data();

                        type: 'hotel',
                        name: data.name || 'Unknown Hotel',
                        category: `Hotels • ${data.location || 'Unknown'}`,
                        image: data.image || 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800',
                        price: extractPrice(data.price),
                        link: data.affiliateLink || '#',
                        badge: "",
                        bookingInfo: "Instant confirmation",
                        rating: data.rating || "4.0",
                        reviewCount: "0"
                    });
                });
                
                // Add tours
                toursSnapshot.forEach(doc => {
                    const data = doc.data();
                    allItems.push({
                        type: 'tour',
                        name: data.name || 'Unknown Tour',
                        category: `${data.category || 'Tour'}`,
                        image: data.image || 'https://images.unsplash.com/photo-1588258546145-12f59f1c1e3e?w=800',
                        price: extractPrice(data.price),
                        link: data.link || '#',
                        badge: data.badge || "",
                        bookingInfo: data.bookingInfo || "Book now",
                        rating: data.rating || "4.5",
                        reviewCount: data.reviewCount || "0"
                    });
                });
                
                if (allItems.length === 0) {
                    allItems = sampleItems;
                }
                
                filteredItems = [...allItems];
                displayItems();
            });
        }

        // Extract Price
        function extractPrice(priceStr) {
            if (typeof priceStr === 'number') return priceStr;
            const match = priceStr.toString().match(/[\d.]+/);
            return match ? parseFloat(match[0]) : 0;
        }

        // Display Items
        function displayItems() {
            const grid = document.getElementById('resultsGrid');
            const noResults = document.getElementById('noResults');
            const count = document.getElementById('resultsCount');
            
            count.textContent = filteredItems.length;
            
            if (filteredItems.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            grid.innerHTML = '';
            
            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${item.image}" alt="${item.name}" class="card-image">
                        ${item.badge ? `<span class="card-badge ${item.badge.toLowerCase().includes('choice') ? 'klook-choice' : ''}">${item.badge}</span>` : ''}
                        <button class="card-wishlist" onclick="toggleWishlist(event)">
                            <i class="far fa-heart"></i>
                        </button>
                    </div>
                    <div class="card-content">
                        <div class="card-category">${item.category}</div>
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-booking-info">${item.bookingInfo}</div>
                        <div class="card-rating">
                            <i class="fas fa-star"></i>
                            <span>${item.rating} (${item.reviewCount})</span>
                        </div>
                        <div class="card-price">From US$ ${item.price.toFixed(2)}</div>
                        <div class="card-actions">
                            <button class="card-btn card-btn-details" onclick="showDetails('${item.name}', '${item.category}', '${item.bookingInfo}', '${item.image}', 'US$ ${item.price.toFixed(2)}', '${item.rating}', '${item.reviewCount}')">
                                <i class="fas fa-info-circle"></i> Details
                            </button>
                            <a href="${item.link}" target="_blank" class="card-btn card-btn-book">
                                <i class="fas fa-ticket-alt"></i> Book Now
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search
        function searchItems() {
            searchTerm = document.getElementById('searchInput').value.toLowerCase();
            applyFilters();
        }

        // Filter by Category
        function filterByCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.category-tab').classList.add('active');
            applyFilters();
        }

        // Apply Filters
        function applyFilters() {
            let filtered = [...allItems];
            
            // Search filter
            if (searchTerm) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) ||
                    item.category.toLowerCase().includes(searchTerm)
                );
            }
            
            // Category filter
            if (currentCategory !== 'all') {
                filtered = filtered.filter(item => item.type === currentCategory);
            }
            
            // Price filter
            const minPrice = parseFloat(document.querySelector('.price-input').value) || 0;
            const maxPrice = parseFloat(document.querySelectorAll('.price-input')[1].value) || 999999;
            filtered = filtered.filter(item => item.price >= minPrice && item.price <= maxPrice);
            
            filteredItems = filtered;
            displayItems();
        }

        // Sort
        function sortItems() {
            const sortBy = document.getElementById('sortDropdown').value;
            
            switch(sortBy) {
                case 'price-low':
                    filteredItems.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filteredItems.sort((a, b) => b.price - a.price);
                    break;
                case 'rating':
                    filteredItems.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
                    break;
                default:
                    break;
            }
            
            displayItems();
        }

        // Show Details
        function showDetails(name, category, bookingInfo, image, price, rating, reviewCount) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.cssText = `
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.8);
                z-index: 3000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
            `;
            
            modal.innerHTML = `
                <div style="background: white; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 20px;">
                    <div style="position: relative;">
                        <img src="${image}" style="width: 100%; height: 300px; object-fit: cover;">
                        <button onclick="this.closest('.modal').remove()" style="position: absolute; top: 20px; right: 20px; background: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div style="padding: 2rem;">
                        <div style="color: #667eea; font-weight: 600; margin-bottom: 0.5rem;">${category}</div>
                        <h2 style="font-size: 2rem; margin-bottom: 1rem; color: #333;">${name}</h2>
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                            <div style="display: flex; align-items: center; gap: 0.3rem;">
                                <i class="fas fa-star" style="color: #ffa500;"></i>
                                <span style="font-weight: 600;">${rating}</span>
                                <span style="color: #666;">(${reviewCount} reviews)</span>
                            </div>
                            <span style="color: #999;">•</span>
                            <span style="color: #666;">${bookingInfo}</span>
                        </div>
                        <div style="font-size: 1.8rem; color: #667eea; font-weight: 700; margin-bottom: 2rem;">${price}</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <a href="#" class="card-btn card-btn-book" style="padding: 1rem;">
                                <i class="fas fa-ticket-alt"></i> Book Now
                            </a>
                            <a href="https://wa.me/94766488689?text=I'm interested in ${encodeURIComponent(name)}" target="_blank" class="card-btn" style="background: #25D366; color: white; padding: 1rem;">
                                <i class="fab fa-whatsapp"></i> WhatsApp
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
        }

        // Toggle Wishlist
        function toggleWishlist(event) {
            event.stopPropagation();
            const icon = event.currentTarget.querySelector('i');
            icon.classList.toggle('far');
            icon.classList.toggle('fas');
            icon.style.color = icon.classList.contains('fas') ? '#ff6b6b' : '';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadItems();
        });
    </script>
</body>
</html>
