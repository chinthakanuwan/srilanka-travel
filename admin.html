<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Silva's Express</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-panel {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tab {
            padding: 1rem 2rem;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .content-section {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .destination-list {
            display: grid;
            gap: 1rem;
        }

        .destination-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .destination-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .destination-info {
            flex: 1;
            margin-left: 1rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-edit {
            background: #4CAF50;
            color: white;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-add {
            background: #667eea;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-modal {
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 1rem;
        }

        .success {
            color: green;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <!-- Login Form -->
    <div class="login-container" id="loginContainer">
        <h2>🔐 Admin Login</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="adminEmail" placeholder="admin@silvasexpress.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password">
        </div>
        <button class="btn" onclick="login()">Login</button>
        <div class="error" id="loginError"></div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="header">
            <h1>️ Admin Dashboard</h1>
            <button class="btn" onclick="logout()" style="width: auto; padding: 0.5rem 1rem;">Logout</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('destinations')">Destinations</button>
            <button class="tab" onclick="showTab('bookings')">Bookings</button>
            <button class="tab" onclick="showTab('settings')">Settings</button>
        </div>

        <!-- Destinations Tab -->
        <div id="destinationsTab" class="content-section">
            <h2>Manage Destinations</h2>
            <button class="btn-add" onclick="openModal()">+ Add New Destination</button>
            <div class="destination-list" id="destinationList"></div>
        </div>

        <!-- Bookings Tab -->
        <div id="bookingsTab" class="content-section" style="display: none;">
            <h2>Recent Bookings</h2>
            <div id="bookingsList"></div>
        </div>

        <!-- Settings Tab -->
        <div id="settingsTab" class="content-section" style="display: none;">
            <h2>Website Settings</h2>
            <div class="form-group">
                <label>Contact Phone</label>
                <input type="text" id="contactPhone" value="+94 77 XXX XXXX">
            </div>
            <div class="form-group">
                <label>Contact Email</label>
                <input type="email" id="contactEmail" value="silvasexpress@gmail.com">
            </div>
            <button class="btn" onclick="updateSettings()">Save Settings</button>
            <div id="settingsMessage"></div>
        </div>
    </div>

    <!-- Add/Edit Destination Modal -->
    <div class="modal" id="destinationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Destination</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <form id="destinationForm" onsubmit="saveDestination(event)">
                <input type="hidden" id="destId">
                <div class="form-group">
                    <label>Destination Name</label>
                    <input type="text" id="destName" required placeholder="e.g., Dubai, UAE">
                </div>
                <div class="form-group">
                    <label>Emoji</label>
                    <input type="text" id="destEmoji" required placeholder="e.g., 🏙️">
                </div>
                <div class="form-group">
                    <label>From</label>
                    <input type="text" id="destFrom" required placeholder="e.g., From Colombo">
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="text" id="destPrice" required placeholder="e.g., LKR 45,000">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="destImage" required placeholder="https://...">
                </div>
                <button type="submit" class="btn">Save Destination</button>
            </form>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Check if user is logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadDestinations();
                loadBookings();
            } else {
                document.getElementById('loginContainer').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        });

        // Login
        function login() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    document.getElementById('loginError').textContent = error.message;
                });
        }

        // Logout
        function logout() {
            auth.signOut();
        }

        // Load Destinations
        function loadDestinations() {
            db.collection('destinations').onSnapshot((snapshot) => {
                const list = document.getElementById('destinationList');
                list.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const item = `
                        <div class="destination-item">
                            <img src="${data.image}" alt="${data.name}">
                            <div class="destination-info">
                                <h3>${data.emoji} ${data.name}</h3>
                                <p>${data.from} - <strong>${data.price}</strong></p>
                            </div>
                            <div class="actions">
                                <button class="btn-small btn-edit" onclick="editDestination('${doc.id}')">Edit</button>
                                <button class="btn-small btn-delete" onclick="deleteDestination('${doc.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                    list.innerHTML += item;
                });
            });
        }

        // Add/Edit Destination
        function openModal() {
            document.getElementById('modalTitle').textContent = 'Add Destination';
            document.getElementById('destinationForm').reset();
            document.getElementById('destId').value = '';
            document.getElementById('destinationModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('destinationModal').style.display = 'none';
        }

        function saveDestination(e) {
            e.preventDefault();
            
            const id = document.getElementById('destId').value;
            const data = {
                name: document.getElementById('destName').value,
                emoji: document.getElementById('destEmoji').value,
                from: document.getElementById('destFrom').value,
                price: document.getElementById('destPrice').value,
                image: document.getElementById('destImage').value
            };

            if (id) {
                db.collection('destinations').doc(id).update(data);
            } else {
                db.collection('destinations').add(data);
            }

            closeModal();
        }

        function editDestination(id) {
            db.collection('destinations').doc(id).get().then((doc) => {
                const data = doc.data();
                document.getElementById('destId').value = id;
                document.getElementById('destName').value = data.name;
                document.getElementById('destEmoji').value = data.emoji;
                document.getElementById('destFrom').value = data.from;
                document.getElementById('destPrice').value = data.price;
                document.getElementById('destImage').value = data.image;
                document.getElementById('modalTitle').textContent = 'Edit Destination';
                document.getElementById('destinationModal').style.display = 'flex';
            });
        }

        function deleteDestination(id) {
            if (confirm('Are you sure you want to delete this destination?')) {
                db.collection('destinations').doc(id).delete();
            }
        }

        // Load Bookings
        function loadBookings() {
            db.collection('bookings').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                const list = document.getElementById('bookingsList');
                list.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const item = `
                        <div class="destination-item">
                            <div class="destination-info">
                                <h3>${data.name}</h3>
                                <p>Destination: ${data.destination}</p>
                                <p>Date: ${data.date} | Guests: ${data.guests}</p>
                                <p>Email: ${data.email} | Phone: ${data.phone}</p>
                            </div>
                        </div>
                    `;
                    list.innerHTML += item;
                });
            });
        }

        // Update Settings
        function updateSettings() {
            const phone = document.getElementById('contactPhone').value;
            const email = document.getElementById('contactEmail').value;
            
            db.collection('settings').doc('contact').set({
                phone: phone,
                email: email
            }).then(() => {
                document.getElementById('settingsMessage').innerHTML = '<div class="success">Settings saved successfully!</div>';
            });
        }

        // Tab Navigation
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(section => section.style.display = 'none');
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').style.display = 'block';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('destinationModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

</body>
</html>
